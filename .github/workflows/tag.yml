name: Tag

on:
  pull_request:
    branches:
      - 'main'
    types:
      - closed
    paths:
      - 'pyproject.toml'

permissions:
  contents: write
  issues: write
  checks: write
  pull-requests: write
  pages: write
  id-token: write
  packages: write

jobs:
  create_tag:
    if: |
      (github.event.pull_request.merged == true) &&
      contains(github.event.pull_request.labels.*.name, 'automatic_bump')
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      prerelease: ${{ steps.version_type.outputs.is_prerelease }}
    steps:
      - name: Install and configure Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Receive version
        id: version_type
        run: |
          new_version=$(poetry version -s)
          echo "new_version=${new_version}" >> $GITHUB_ENV
          is_prerelease=true
          if [[ $new_version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$ ]]; then is_prerelease=false;fi
          echo "is_prerelease=${is_prerelease}" >> $GITHUB_OUTPUT
      - name: create git tag
        id: tag_version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ env.new_version }}
          tag_prefix: ''
  trigger_release:
    needs: [create_tag]
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      tag: ${{ needs.create_tag.outputs.new_tag }}
      prerelease: ${{ needs.create_tag.outputs.prerelease }}
