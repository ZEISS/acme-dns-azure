name: Release

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      prerelease:
        type: string
        required: false
        default: 'true'

permissions:
  issues: write
  checks: write
  pull-requests: write
  contents: write
  pages: write
  id-token: write
  packages: write

jobs:
  unit_test:
    permissions:
      issues: write
      checks: write
      pull-requests: write
    uses: ./.github/workflows/unit_test.yml
  integration_test:
    needs: [unit_test]
    uses: ./.github/workflows/integration_test.yml
    secrets: inherit
  docs:
    needs: [integration_test]
    uses: ./.github/workflows/docs.yml
  publish_pypi:
    runs-on: ubuntu-latest
    needs: [docs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and publish to pypi
        uses: JRubics/poetry-publish@4b3306307f536bbfcb559603629b3b4f6aef5ab8 # v2.1
        with:
          pypi_token: ${{ secrets.PYPI_TOKEN }}
  function_package:
    needs: [publish_pypi]
    uses: ./.github/workflows/azure_function.yml
  docker_build:
    needs: [publish_pypi]
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ inputs.tag }}
  git_release:
    runs-on: ubuntu-latest
    needs: [docker_build, function_package]
    permissions:
      contents: write
    steps:
      - name: Create changelog text
        id: changelog
        uses: loopwerk/tag-changelog@b4e8627bdc44f527663dc36b3187e32f663d1778 # v1.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          exclude_types: doc
      - name: download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: '/tmp/${{  github.ref_name }}'
      - name: Create a GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          body: ${{ steps.changelog.outputs.changes }}
          artifacts: '/tmp/${{  github.ref_name }}/**/*.zip'
          prerelease: ${{ inputs.prerelease }}
          tag: ${{ inputs.tag }}
