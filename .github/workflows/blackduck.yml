name: blackduck
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  issues: write
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Check Black Duck reachability
        run: curl -o /dev/null -s -w "%{http_code}" ${{ secrets.BLACKDUCK_URL }}api/current-version
      - name: Black Duck Full Scan
        if: ${{ github.event_name != 'pull_request' }}
        uses: blackduck-inc/black-duck-security-scan@v2.11.0
        env:
          DETECT_PROJECT_NAME: "MED_HDP_Central_Container_Registry"
        with:
          blackducksca_url: ${{ secrets.BLACKDUCK_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCK_TOKEN }}
          blackducksca_scan_full: true
          blackducksca_scan_failure_severities: "BLOCKER,CRITICAL"
          blackducksca_fixpr_enabled: true
          blackducksca_fixpr_maxCount: 5
          blackducksca_fixpr_filter_severities: "CRITICAL,HIGH"
          blackducksca_fixpr_useUpgradeGuidance: "SHORT_TERM,LONG_TERM"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          include_diagnostics: true

      - name: Black Duck PR Scan
        if: ${{ github.event_name == 'pull_request' }}
        uses: blackduck-inc/black-duck-security-scan@v2.11.0
        env:
          DETECT_PROJECT_NAME: "MED_HDP_Central_Container_Registry"
        with:
          blackducksca_url: ${{ secrets.BLACKDUCK_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCK_TOKEN }}
          blackducksca_scan_full: false
          blackducksca_prComment_enabled: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          include_diagnostics: true
