name: blackduck
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  issues: write
  checks: write
  pull-requests: write
  contents: write

jobs:
  build:
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Black Duck Full Scan
        if: ${{ github.event_name != 'pull_request' }}
        uses: blackduck-inc/black-duck-security-scan@152247222aa94cce79f3fd98f24e5f5e4b2e6d64 # v2.11.0
        env:
          DETECT_PROJECT_NAME: 'MED_acme-dns-azure'
        with:
          blackducksca_url: ${{ secrets.BLACKDUCK_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCK_TOKEN }}
          blackducksca_scan_full: true
          blackducksca_scan_failure_severities: 'BLOCKER,CRITICAL'
          blackducksca_fixpr_enabled: true
          blackducksca_fixpr_maxCount: 5
          blackducksca_fixpr_filter_severities: 'CRITICAL,HIGH'
          blackducksca_fixpr_useUpgradeGuidance: 'SHORT_TERM,LONG_TERM'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Black Duck PR Scan
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.title, 'Create release') }}
        uses: blackduck-inc/black-duck-security-scan@152247222aa94cce79f3fd98f24e5f5e4b2e6d64 # v2.11.0
        env:
          DETECT_PROJECT_NAME: 'MED_acme-dns-azure'
        with:
          blackducksca_url: ${{ secrets.BLACKDUCK_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCK_TOKEN }}
          blackducksca_scan_full: false
          blackducksca_prComment_enabled: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
