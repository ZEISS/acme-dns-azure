[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]

[tool.poetry]
authors = [
  "ZEISS Digital Innovation Partners",
]
description = "ACME DNS Azure Function example"
include = [
  {path = ".python_packages/**/*"},
]
license = "MIT"
name = "acme-dns-azure-function"
packages = [
  {include = "host.json"},
  {include = "version.py"},
  {include = "function_app.py"},
]
readme = "README.md"
version = "1.8.1"

[tool.poetry_bumpversion.file."version.py"]

[tool.poetry.dependencies]
acme-dns-azure = "*"
azure-functions = {version = ">=1"}
cffi = "*"
certifi = ">=2026.10.23"
dnspython = ">=2.9.0"
pyjwt = ">=2.15.0"
setuptools = ">=84.1.0"
werkzeug = ">=3.1.9"
python = "^3.14,<3.15"
cryptography = "^50.0.0"

[tool.poetry.scripts]
add-plugins = "poetry:add_plugins"
build = "poetry:build"
start = "poetry:start_function"
